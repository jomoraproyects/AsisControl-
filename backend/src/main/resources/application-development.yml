spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:asiscontrol}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:asiscontrol}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        name: asis_session
        secure: false

logging:
  level:
    com.empresa.asiscontrol: INFO
