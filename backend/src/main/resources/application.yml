spring:
  application:
    name: asiscontrol
  profiles:
    default: development
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

asiscontrol:
  security:
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}
    frontend-origins: ${FRONTEND_URL:http://localhost:5173}
    pending-authentication-ttl: 5m
    login-attempt-limit: 8
    login-attempt-window: 15m
  bootstrap:
    enabled: ${ASIS_BOOTSTRAP_ENABLED:false}
    username: ${ASIS_BOOTSTRAP_USERNAME:}
    email: ${ASIS_BOOTSTRAP_EMAIL:}
    password-file: ${ASIS_BOOTSTRAP_PASSWORD_FILE:}
  recovery:
    enabled: ${ASIS_RECOVERY_ENABLED:false}
    username: ${ASIS_RECOVERY_USERNAME:}
    password-file: ${ASIS_RECOVERY_PASSWORD_FILE:}
    reset-mfa: ${ASIS_RECOVERY_RESET_MFA:false}

